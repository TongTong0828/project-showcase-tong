name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (CI minimal set)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deliver]"

      - name: Ruff check (core rules)
        run: ruff check --select E,F,W,I --ignore E501 src tests

      - name: Pytest (pure logic)
        env:
          PYTHONPATH: .:src:tests
        run: pytest -q --ignore=tests/eval

      - name: Smoke import check
        env:
          PYTHONPATH: src
        run: python scripts/_run_smoke.py

  deepseek-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare root Python venv for MCP fixture tests
        run: python -m venv .venv

      - name: Enable pnpm
        run: corepack enable

      - name: Install DeepSeek Harness deps
        working-directory: integrations/deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: DeepSeek Harness typecheck
        working-directory: integrations/deepseek-harness
        run: pnpm typecheck

      - name: DeepSeek Harness tests
        working-directory: integrations/deepseek-harness
        run: pnpm test

      - name: DeepSeek Harness smoke
        working-directory: integrations/deepseek-harness
        run: pnpm smoke
